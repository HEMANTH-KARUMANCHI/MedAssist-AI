apiVersion: v1
kind: Namespace
metadata:
  name: medassist-ai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: medassist-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medassist-db
  namespace: medassist-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medassist-db
  template:
    metadata:
      labels:
        app: medassist-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "medassist_ai"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medassist-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: medassist-db-service
  namespace: medassist-ai
spec:
  selector:
    app: medassist-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medassist-backend
  namespace: medassist-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medassist-backend
  template:
    metadata:
      labels:
        app: medassist-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/hemanth-karumanchi/medassist-ai-backend:latest
          env:
            - name: DB_HOST
              value: "medassist-db-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "medassist_ai"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medassist-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medassist-secrets
                  key: SECRET_KEY
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: medassist-backend-service
  namespace: medassist-ai
spec:
  selector:
    app: medassist-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medassist-frontend
  namespace: medassist-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medassist-frontend
  template:
    metadata:
      labels:
        app: medassist-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/hemanth-karumanchi/medassist-ai-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: medassist-frontend-service
  namespace: medassist-ai
spec:
  type: LoadBalancer
  selector:
    app: medassist-frontend
  ports:
    - port: 80
      targetPort: 80
