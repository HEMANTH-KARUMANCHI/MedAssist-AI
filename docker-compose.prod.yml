services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: medassist_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-medassist_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-medassist_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medassist_prod_net

  # 2. FastAPI + ML Inference Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medassist_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medassist_ai}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_prod_uploads:/app/backend/uploads/patient_reports
    networks:
      - medassist_prod_net

  # 3. React Frontend + Nginx Web Server
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: medassist_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    networks:
      - medassist_prod_net

volumes:
  postgres_prod_data:
    driver: local
  backend_prod_uploads:
    driver: local

networks:
  medassist_prod_net:
    driver: bridge
