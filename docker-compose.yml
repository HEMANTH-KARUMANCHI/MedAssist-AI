services:
  # Database Service: PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: medassist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medassist_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-psql@2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-medassist_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medassist_network

  # Backend Service: FastAPI + ML Inference
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medassist_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medassist_ai}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-psql@2026}
      SECRET_KEY: ${SECRET_KEY:-medassist-ai-secret-key-change-later}
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/backend/uploads/patient_reports
    networks:
      - medassist_network

  # Frontend Service: React + Vite + Nginx
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: medassist_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - medassist_network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  medassist_network:
    driver: bridge
